  <style>.profile-container{padding:var(--spacing-2xl) 0}.profile-header-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--spacing-xl);align-items:center;gap:var(--spacing-lg);margin-bottom:var(--spacing-2xl);box-shadow:var(--shadow-md);display:flex}.profile-page-avatar{border:3px solid var(--color-primary-soft);object-fit:cover;background:var(--color-surface-muted);border-radius:50%;width:96px;height:96px}.profile-info h1{font-family:var(--font-display-ar);margin-bottom:4px;font-size:1.6rem;font-weight:800}.profile-info p{color:var(--color-text-secondary);margin-bottom:var(--spacing-md);font-size:.95rem}.profile-stats h2{font-family:var(--font-display-ar);margin-bottom:var(--spacing-lg);color:var(--color-primary);font-size:1.2rem}.profile-stats .stats-grid{gap:var(--spacing-md);grid-template-columns:repeat(auto-fill,minmax(260px,1fr));display:grid}.profile-stats .stat-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--spacing-md)}.profile-stats .stat-card h4{margin-bottom:var(--spacing-sm);color:var(--color-text);font-size:.95rem;font-weight:700}.stat-details{justify-content:space-between;align-items:center;margin-bottom:6px;display:flex}.score-value{color:var(--color-primary);font-size:1.3rem;font-weight:800}.score-pct{color:var(--color-text-muted);margin-right:6px;font-size:.85rem}.stat-status{border-radius:var(--radius-full);padding:3px 10px;font-size:.78rem;font-weight:700}.status-pass{background:var(--color-success-bg);color:var(--color-success)}.status-fail{background:var(--color-error-bg);color:var(--color-error)}.stat-date{color:var(--color-text-muted);font-size:.75rem}.empty-state{color:var(--color-text-muted);text-align:center;padding:var(--spacing-xl)}</style>

    <header class="site-header" id="site-header">

            </svg>

            <span class="brand-subtitle">منصة تعلّم البرمجة</span>
          </div>
        </a>
        <nav class="header-nav">
          <a href="#how-it-works" class="nav-link nav-link-how" id="nav-how-it-works">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>

              <line x1="12" y1="17" x2="12.01" y2="17"/>

          <!-- Auth Container -->
          <div id="auth-container" class="auth-container">
            <button class="btn btn-primary btn-sm" id="btn-login" style="display: none;">
              تسجيل الدخول
            </button>
            <button class="profile-avatar-btn" id="btn-profile" style="display: none;" title="الملف الشخصي">
              <img src="" alt="Profile" id="profile-avatar" />
            </button>
          </div>
          <button class="theme-toggle" id="theme-toggle" type="button" title="تبديل الوضع الليلي"
            aria-label="تبديل الوضع الليلي">
            <span class="theme-toggle-knob" id="theme-toggle-knob">🌙</span>
          </button>
        </nav>
      </div>
    </header>

  <main id="profile-view">
    <div class="container profile-container">
      <div class="profile-header-card" data-reveal>
        <img src="/assets/images/default-avatar.svg" alt="Profile" id="profile-page-avatar" class="profile-page-avatar">
        <div class="profile-info">
          <h1 id="profile-page-name">جاري التحميل...</h1>
          <p id="profile-page-email">يرجى الانتظار</p>
          <button class="btn btn-secondary btn-sm" id="btn-logout" type="button">تسجيل الخروج</button>
        </div>
      </div>

      <div class="profile-stats" data-reveal>
        <h2>إحصائيات الاختبارات</h2>
        <div class="stats-grid" id="profile-stats-grid">
          <p class="empty-state">لم تقم بإجراء أي اختبارات بعد.</p>
        </div>
      </div>
    </div>
  </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-brand">Quinzy</div>
        <p class="footer-text">منصة تعليمية لطلاب تكنولوجيا المعلومات — نظام البكالوريا المصرية</p>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (!localStorage.getItem('quinzy_token')) {
          window.location.href = '/login.html';
        }
      }, 300);
    });
  </script>
