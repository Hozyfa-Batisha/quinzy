<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  {{> head title="الملف الشخصي" }}
  <style>
    /* ── Profile Page ──────────────────────────────────── */
    .profile-page {
      min-height: calc(100vh - var(--header-height));
      padding: 48px 0 80px;
      background: var(--color-bg);
    }

    .profile-wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 var(--spacing-lg);
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* ── Alert ─────────────────────────────────────────── */
    .profile-alert {
      display: none;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 500;
    }
    .profile-alert.show { display: block; }
    .profile-alert.success {
      background: var(--color-success-bg);
      color: var(--color-success);
      border: 1px solid var(--color-success);
    }
    .profile-alert.error {
      background: var(--color-error-bg);
      color: var(--color-error);
      border: 1px solid var(--color-error);
    }

    /* ── Identity Card ─────────────────────────────────── */
    .profile-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 36px;
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    @media (max-width: 600px) {
      .profile-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 28px 20px;
        gap: 20px;
      }
      .profile-actions { justify-content: center; }
    }

    /* ── Avatar ────────────────────────────────────────── */
    .avatar-zone {
      position: relative;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--color-border);
      background: var(--color-surface-muted);
      display: block;
      transition: filter 0.25s ease;
    }

    /* When in edit mode: show overlay */
    .avatar-zone.edit-mode .avatar-img {
      filter: brightness(0.6);
      cursor: pointer;
    }

    .avatar-upload-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .avatar-zone.edit-mode .avatar-upload-overlay {
      opacity: 1;
      pointer-events: all;
    }

    .avatar-upload-overlay svg {
      color: #fff;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
    }

    /* ── Profile Info ──────────────────────────────────── */
    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      font-family: var(--font-display-ar);
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--color-text);
      margin: 0 0 6px;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .profile-username {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      background: var(--color-surface-muted);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      margin-bottom: 6px;
      direction: ltr;
    }

    .profile-email {
      font-size: 0.92rem;
      color: var(--color-text-muted);
      margin: 0 0 24px;
    }

    /* ── Actions ───────────────────────────────────────── */
    .profile-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-edit {
      padding: 9px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-edit:hover {
      background: var(--color-surface-muted);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .btn-logout {
      padding: 9px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-logout:hover {
      color: var(--color-error);
      background: var(--color-error-bg);
    }

    /* ── Edit Form ─────────────────────────────────────── */
    .edit-form-card {
      background: var(--color-surface);
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-xl);
      padding: 32px;
      display: none;
    }

    .edit-form-card.open { display: block; }

    .edit-form-title {
      font-family: var(--font-display-ar);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-text);
      margin: 0 0 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--color-border);
    }

    .edit-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (max-width: 600px) {
      .edit-fields { grid-template-columns: 1fr; }
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field-input {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-bg);
      color: var(--color-text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }

    .field-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-soft);
    }

    .field-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: var(--color-surface-muted);
    }

    .edit-form-footer {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-save {
      padding: 10px 24px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--color-primary);
      color: #fff;
      cursor: pointer;
      transition: opacity 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-save:hover { opacity: 0.88; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-cancel-edit {
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-cancel-edit:hover {
      background: var(--color-surface-muted);
      color: var(--color-text);
    }

    .save-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Stats Section ─────────────────────────────────── */
    .stats-section { }

    .stats-title {
      font-family: var(--font-display-ar);
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--color-text);
      margin: 0 0 20px;
      letter-spacing: -0.01em;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .stat-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s ease, transform 0.25s ease;
    }
    .stat-card:hover {
      border-color: var(--color-primary-soft);
      transform: translateY(-2px);
    }

    .stat-lesson-name {
      font-family: var(--font-display-ar);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.4;
    }

    .stat-score-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .stat-score-main {
      font-family: var(--font-mono);
      font-size: 2rem;
      font-weight: 800;
      color: var(--color-text);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .stat-score-pct {
      font-size: 0.85rem;
      color: var(--color-text-muted);
    }

    .stat-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--color-border);
    }

    .stat-date {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      font-family: var(--font-mono);
    }

    .stat-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .stat-badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .stat-badge.pass {
      color: var(--color-success);
      background: var(--color-success-bg);
    }
    .stat-badge.fail {
      color: var(--color-error);
      background: var(--color-error-bg);
    }

    .stats-empty {
      grid-column: 1 / -1;
      padding: 64px 24px;
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.95rem;
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-lg);
    }
    .stats-empty svg {
      display: block;
      margin: 0 auto 16px;
      opacity: 0.3;
    }

    .stats-loading {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  {{> header }}

  <main class="profile-page">
    <div class="profile-wrap">

      <!-- Alert -->
      <div id="profile-alert" class="profile-alert" role="alert"></div>

      <!-- Identity Card -->
      <div class="profile-card" id="profile-card" data-reveal>

        <!-- Avatar -->
        <div class="avatar-zone" id="avatar-zone">
          <img id="profile-page-avatar"
               src="/assets/images/default-avatar.svg"
               alt="صورة الملف الشخصي"
               class="avatar-img">
          <label for="avatar-file-input" class="avatar-upload-overlay" title="تغيير الصورة">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </label>
          <input type="file" id="avatar-file-input" accept="image/png,image/jpeg,image/webp" style="display:none;">
        </div>

        <!-- Info -->
        <div class="profile-info">
          <h1 class="profile-name" id="profile-page-name">—</h1>
          <span class="profile-username" id="profile-page-username">@—</span>
          <p class="profile-email" id="profile-page-email">—</p>

          <div class="profile-actions">
            <button class="btn-edit" id="btn-edit-profile" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              تعديل الملف الشخصي
            </button>
            <button class="btn-logout" id="btn-logout" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              تسجيل الخروج
            </button>
          </div>
        </div>
      </div>

      <!-- Edit Form (hidden by default, shown when edit mode active) -->
      <div class="edit-form-card" id="edit-form-card" data-reveal>
        <p class="edit-form-title">إعدادات الحساب</p>
        <form id="profile-edit-form" novalidate>
          <div class="edit-fields">
            <div class="field-group">
              <label class="field-label" for="edit-name">الاسم الكامل</label>
              <input class="field-input" type="text" id="edit-name"
                     placeholder="أدخل اسمك" required minlength="2">
            </div>
            <div class="field-group">
              <label class="field-label" for="edit-username">اسم المستخدم</label>
              <input class="field-input" type="text" id="edit-username"
                     disabled title="لا يمكن تغيير اسم المستخدم">
            </div>
            <div class="field-group" style="grid-column: 1 / -1;">
              <label class="field-label" for="edit-email">البريد الإلكتروني</label>
              <input class="field-input" type="email" id="edit-email"
                     placeholder="name@example.com" required>
            </div>
          </div>
          <div class="edit-form-footer">
            <button class="btn-save" id="btn-save-profile" type="submit">
              <span class="save-spinner" id="save-spinner"></span>
              حفظ التغييرات
            </button>
            <button class="btn-cancel-edit" id="btn-cancel-edit" type="button">إلغاء</button>
          </div>
        </form>
      </div>

      <!-- Stats Section -->
      <section class="stats-section" data-reveal>
        <h2 class="stats-title">سجل الاختبارات</h2>
        <div class="stats-grid" id="profile-stats-grid">
          <div class="stats-loading">جاري التحميل…</div>
        </div>
      </section>

    </div>
  </main>

  {{> footer-minimal }}

  <script src="/assets/js/data/lessons.js"></script>
  <script src="/assets/js/modules/profile.js"></script>

  <script>
    /* Redirect if not logged in */
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (!localStorage.getItem('quinzy_token')) {
          window.location.href = '/login.html';
        }
      }, 350);
    });
  </script>
</body>
</html>
