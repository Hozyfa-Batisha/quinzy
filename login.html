<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  {{> head title="تسجيل الدخول" }}
  <style>
    .login-container {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
    }

    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-2xl);
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .login-icon {
      width: 64px;
      height: 64px;
      background: var(--color-cta-dim);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--spacing-lg);
      color: var(--color-cta);
    }

    .login-icon svg {
      width: 32px;
      height: 32px;
    }

    .login-title {
      font-size: 24px;
      font-family: var(--font-heading);
      margin-bottom: var(--spacing-sm);
      color: var(--color-text);
    }

    .login-desc {
      color: var(--color-text-dim);
      margin-bottom: var(--spacing-xl);
      line-height: 1.6;
    }

    .g_id_signin {
      display: flex;
      justify-content: center;
      margin-top: var(--spacing-md);
    }
  </style>
</head>

<body>
  {{> header }}

  <main>
    <div class="login-container">
      <div class="login-card" data-reveal>
        <div class="login-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <h1 class="login-title">أهلاً بك في Quinzy</h1>
        <p class="login-desc">يرجى تسجيل الدخول باستخدام حساب جوجل الخاص بك لمتابعة مسار التعلم وحفظ نتائج اختباراتك.
        </p>

        <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID" data-context="signin" data-ux_mode="popup"
          data-callback="handleCredentialResponse" data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
          data-text="signin_with" data-size="large" data-logo_alignment="left">
        </div>

        <div>
          <a href="index.html"
            style="text-decoration: none; color: var(--color-cta); font-size: var(--font-size-sm); margin-top: var(--spacing-md); display: block;">تخطي
            تسجيل الدخول والانتقال إلى الموقع</a>
        </div>
      </div>
    </div>
  </main>

  {{> footer }}

  <script>
    // Overwrite the Google Client ID dynamically from the environment
    document.getElementById('g_id_onload').setAttribute('data-client_id', window.GOOGLE_CLIENT_ID);
  </script>
</body>

</html>
