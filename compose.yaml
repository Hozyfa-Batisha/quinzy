name: quinzy

services:
  quinzy:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    image: quinzy:latest
    container_name: quinzy
    networks:
      - proxy
      - internal
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.quinzy.rule=Host(`${QUINZY_HOSTNAME}`)"
      - "traefik.http.routers.quinzy.entrypoints=websecure"
      - "traefik.http.routers.quinzy.tls.certresolver=letsencrypt"
      - "traefik.http.services.quinzy.loadbalancer.server.port=8080"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: quinzy-backend:latest
    container_name: quinzy-backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - internal

networks:
  proxy:
    external: true
  internal:
    driver: bridge
